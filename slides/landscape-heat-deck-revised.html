*{box-sizing:border-box}html,body{margin:0;background:#d9dadd;color:var(--ink);font-family:'Noto Sans KR',Arial,sans-serif;overflow:hidden}.deck{width:min(1600px,100vw);height:100svh;min-height:560px;background:var(--paper);margin:auto;overflow:hidden}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,76px);border-bottom:1px solid var(--line)}.brand{font-size:12px;font-weight:700;letter-spacing:.08em}.brand:before{content:'';display:inline-block;width:9px;height:9px;background:var(--blue);margin-right:8px}.sect,.page,.source{font:11px 'DM Mono',monospace;color:var(--muted);letter-spacing:.06em}.slide{display:none;height:calc(100svh - 58px);padding:clamp(28px,5vw,72px) clamp(26px,8vw,128px) 72px;position:relative;overflow:auto;align-content:center;gap:24px}.slide.active{display:grid}.eyebrow{margin:0 0 13px;color:var(--blue);font:11px 'DM Mono',monospace;letter-spacing:.08em}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(38px,5.5vw,78px);line-height:1.13;letter-spacing:-.065em;font-weight:600;margin-bottom:18px;word-break:keep-all}h2{font-size:clamp(29px,3.6vw,52px);line-height:1.2;letter-spacing:-.055em;font-weight:600;margin-bottom:12px;word-break:keep-all}h3{font-size:17px;margin:0 0 8px}.lead{font-size:clamp(15px,1.25vw,19px);line-height:1.7;color:var(--text);max-width:850px;word-break:keep-all;margin-bottom:0}.small{font-size:12px;line-height:1.65;color:var(--muted)}.two{grid-template-columns:1fr 1fr;gap:5vw;align-items:center}.hero{background:var(--ash)}.hero-art{height:min(45vw,480px);position:relative;min-height:250px}.sun{position:absolute;right:12%;top:7%;width:18%;aspect-ratio:1;background:var(--blue)}.hill{position:absolute;right:-12%;bottom:0;width:105%;height:70%;background:#171a20;clip-path:polygon(45% 0,100% 75%,100% 100%,0 100%)}.tree{position:absolute;left:13%;top:19%;width:47%;aspect-ratio:1;background:#171a20;clip-path:polygon(48% 0,60% 25%,85% 17%,72% 42%,100% 54%,70% 64%,82% 90%,55% 74%,43% 100%,3 .grid2,.grid3,.grid4,.toc,.cards,.metrics,.steps,.limits{display:grid;gap:12px}.grid2{grid-template-columns:repeat(2,1fr)}.grid3,.metrics{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}.toc{grid-template-columns:repeat(3,1fr)}.panel,.cards article,.toc div,.steps article,.limits article,.metric,.callout{padding:18px;background:var(--ash);font-size:13px;line-height:1.6}.toc b,.steps b{display:block;color:var(--blue);font:11px 'DM Mono';margin-bottom:7px}.metric b{display:block;color:var(--blue);font:clamp(25px,3vw,43px) 'DM Mono';letter-spacing:-.07em;margin-bottom:7px}.metric span{font-size:12px;color:var(--muted)}.quote{border-left:4px solid var(--blue);padding:14px 0 14px 22px;font-size:clamp(22px,3vw,39px);line-height:1.42;letter-spacing:-.04em;word-break:keep-all}.tablewrap{overflow:auto;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;font-size:12px;line-height:1.5}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:normal}th{background:var(--ash);font-weight:700}td.num{text-align:right;font-family:'DM Mono',monospace;white-space:nowrap}.barlist{display:grid;gap:13px}.barrow{display:grid;grid-template-columns:115px 1fr 90px;gap:12px;align-items:center;font-size:12px}.track{height:17px;background:var(--ash);position:relative}.fill{height:100%;background:var(--blue)}.barval{text-align:right;font:12px 'DM Mono';white-space:nowrap}.ringviz{width:min(330px,70vw);aspect-ratio:1;margin:auto;position:relative}.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #92969e;border-radius:50%}.r1{width:26%;height:26%;background:var(--blue);border:0}.r2{width:52%;height:52%}.r3{width:76%;height:76%}.r4{width:100%;height:100%}.steps{grid-template-columns:repeat(4,1fr)}.take{background:#171a20;color:#fff}.take .lead{color:#d4d6d8}.take .eyebrow{color:#91a7ff}.take .grid3 .panel{background:#24262a;color:#fff}.take b{color:#9eb4ff}.footer-note{font-size:11px;line-height:1.5;color:var(--muted);margin-top:10px}.nav{position:absolute;right:clamp(22px,5vw,76px);bottom:20px;display:flex;gap:8px}.nav button{width:42px;height:34px;border:0;border-radius:4px;background:var(--ash);font-size:17px;cursor:pointer}.nav button:hover{background:var(--blue);color:#fff}.page{position:absolute;left:clamp(26px,8vw,128px);bottom:30px}.pill{display:inline-block;padding:5px 9px;background:var(--pale);color:#254ab4;font-size:11px;font-weight:700;margin:0 5px 5px 0}.dark{background:#171a20;color:white}.dark .lead{color:#d4d6d8}.dark .eyebrow{color:#9eb4ff}.dark .panel{background:#262a31;color:#fff}.dark .small{color:#c2c6cc}

</style></head><body><main class="deck"><header class="top"><div class="brand">BUSAN / PARK HEAT</div><div class="sect" id="sect"></div></header><div id="root"></div></main>
<script>
const slides=[
{sec:'INTRO',title:'공원 옆에 살면,<br>정말 더 시원할까?',lead:'부산 도시공원과 여름철 지표면온도의 관계<br>실제 Landsat 관측자료를 이용한 공간 비교 분석',type:'hero'},
{sec:'CONTENTS',title:'질문에서 실제 결과까지',lead:'연구 배경과 범위부터 데이터 선정, 분석 설계, 결과 해석과 한계까지 24장으로 정리했습니다.',type:'toc'},
{sec:'RESEARCH QUESTION',title:'공원 내부의 땅은 주변보다 얼마나 시원할까?',lead:'같은 날짜에 관측된 공원 내부와 공원 경계 바깥의 지표면온도(LST)를 비교합니다. 핵심 비교 구간은 내부와 300–500m 외부 고리입니다.',type:'quote',quote:'공원이 주변 기온을 낮추는가가 아니라,<br><b>관측된 공원 표면은 주변 육지보다 얼마나 낮았는가?</b>'},
{sec:'WHY SURFACE HEAT',title:'도시의 열환경은 표면의 차이로 나타납니다.',lead:'포장·건축물·식생·수분 조건은 표면이 태양에너지를 흡수하고 방출하는 방식과 연결됩니다. 본 연구는 이 가운데 위성으로 관측한 지표면온도를 다룹니다.',type:'cards',cards:[['표면 재료','불투수 포장과 지붕은 식생 표면과 다른 열적 특성을 가집니다.'],['식생과 그늘','수관 차폐와 증발산은 표면 에너지 환경에 관여합니다.'],['공간 맥락','해안·산지·시가화 정도 등 주변 조건이 장소별 차이를 만듭니다.']]},
{sec:'LANDSCAPE',title:'조경은 열환경을 구성하는 표면을 다룹니다.',lead:'그늘, 식생, 토양과 포장 재료는 공원 설계·관리에서 다룰 수 있는 요소입니다. 다만 이번 위성 분석만으로 각 요소의 인과적 기여를 분리하지는 않습니다.',type:'cards',cards:[['수관과 그늘','식생의 분포와 수관 구조를 현장 자료로 확인할 필요가 있습니다.'],['토양과 수분','증발산과 토양 수분은 관측일의 기상 조건과 함께 해석해야 합니다.'],['포장과 연결성','공원 내부뿐 아니라 외부 고리의 토지피복 구성도 비교해야 합니다.']]},
{sec:'BUSAN',title:'부산은 지형과 토지피복이 다양한 도시입니다.',lead:'해안·산지·고밀 시가지가 함께 분포합니다. 따라서 일부 공원과 관측일에서 얻은 결과를 부산 전체 공원으로 곧바로 일반화할 수 없습니다.',type:'quote',quote:'분석 결과는<br><b>관측된 공원·날짜·육지 픽셀의 범위 안에서</b><br>해석해야 합니다.'},
{sec:'STUDY DESIGN',title:'이번 연구가 답하는 범위를 먼저 정합니다.',lead:'부산 검색 범위 안의 OSM 공원 경계와 2023–2025년 6–8월 Landsat 주간 관측을 사용했습니다. 결과변수는 기온이 아니라 지표면온도(LST, °C)입니다.',type:'metrics',metrics:[['172개','1ha 이상 분석 대상 공원'],['6일','선정 기준을 통과한 관측일'],['4구간','공원 내부 + 외부 3개 고리']]},
{sec:'DATA SOURCES',title:'공원 경계와 위성자료를 결합했습니다.',lead:'공원 경계는 기존 OSM 자료를 사용했고, 지표면온도와 QA는 Landsat Collection 2 Level-2에서 취득했습니다. 고정 육지 마스크에는 ESA WorldCover 2021 v200을 사용했습니다.',type:'cards',cards:[['공원 경계','OSM leisure=park, 기존 분석 경계 583개 폴리곤 중 1ha 이상 172개'],['위성 LST','Landsat 8·9 Collection 2 Level-2, ST_B10과 장면별 배율·오프셋'],['육지 마스크','ESA WorldCover 2021 v200의 상시 수면(클래스 80) 제외']]},
{sec:'PARK SELECTION',title:'분석 대상은 1ha 이상 공원 172개입니다.',lead:'기존 OSM 공원 폴리곤 583개에서 면적 기준을 적용했습니다. 이는 법정 도시공원 전체 목록과 동일하지 않으며, 분석 결과의 모집단 범위를 제한합니다.',type:'metrics',metrics:[['583','원본 OSM 공원 폴리곤'],['172','1ha 이상 분석 대상'],['83','6일 동일 픽셀 분석에 남은 공원']]},
{sec:'SCENE SELECTION',title:'장면 구름률만으로 날짜를 고르지 않았습니다.',lead:'부산 검색 사각형의 약 48.65%가 고정 수면이었습니다. 따라서 전체 사각형이 아닌 고정 육지와 네 분석 구간의 유효 픽셀 비율을 기준으로 날짜를 선정했습니다.',type:'table',headers:['선정 기준','적용 내용'],rows:[['기간','2023–2025년 6–8월, Landsat 8·9'],['장면 조건','STAC 장면 구름률 10% 미만'],['품질 기준','고정 육지 및 네 구간 각각 유효 픽셀 ≥45%'],['선정 결과','6일, 장면 총 8장'] ]},
{sec:'DISTANCE ZONES',title:'공원 경계에서 네 구간을 나눴습니다.',lead:'공원 내부와 경계 밖 0–100m, 100–300m, 300–500m 고리를 비교했습니다. 외부 고리에서는 분석 대상 공원 영역을 제외했습니다.',type:'rings'},
{sec:'RESEARCH QUESTIONS',title:'가설은 결과에 맞춰 질문 형태로 검토합니다.',lead:'분석 전의 가설을 결과가 입증했다고 표현하지 않습니다. 실제 수행한 비교와 확인되지 않은 주장까지 구분합니다.',type:'cards',cards:[['주 질문','공원 내부 LST는 300–500m 고리보다 낮은가?'],['보조 질문 1','0–100m와 100–300m에서도 일관된 거리 경사가 있는가?'],['보조 질문 2','내부–외곽 차이는 공원 면적에 따라 달라지는가?']]},
{sec:'LST & QA',title:'위성 관측값을 품질 기준에 따라 정리했습니다.',lead:'ST_B10이 양수이고 QA_PIXEL 비트 마스크 조건을 통과한 관측만 사용했습니다. 장면 메타데이터의 scale·offset을 적용해 섭씨로 변환했습니다.',type:'steps',steps:[['01','장면 검색','2023–2025년 6–8월'],['02','QA 필터','구름·권운·그림자 등 제외'],['03','LST 변환','ST_B10 scale·offset 적용'],['04','공간 정합','EPSG:32652, 30m 분석 격자']]},
{sec:'COMMON PIXELS',title:'날짜가 달라도 같은 지점을 비교하도록 했습니다.',lead:'각 기간의 모든 날에 유효한 육지 픽셀 위치 교집합을 만들었습니다. 공원별 네 구간 모두에서 교집합 픽셀이 5개 이상일 때만 포함했고, 결측 대체나 공간 보간은 하지 않았습니다.',type:'cards',cards:[['공간 고정','날짜마다 달라지는 관측 위치를 교집합으로 제한'],['공원 기준','네 구간 각각 최소 5개 유효 픽셀'],['가중 방식','공원·구간 평균을 먼저 계산하고 공원에 동일 가중']]},
{sec:'DATA QUALITY',title:'날짜별 기준 통과와 6일 공통 표본은 다릅니다.',lead:'날짜마다 45% 이상 유효하더라도 6일 내내 같은 지점이 남는다는 뜻은 아닙니다. 기존 144개 공원에서 6일 공통으로 남은 공원은 83개였습니다.',type:'metrics',metrics:[['144개','기존 3일 공통 표본'],['83개','6일 공통 표본'],['57.6%','기존 144개 중 잔존 비율']]},
{sec:'MODEL',title:'공원·날짜·거리 구간을 함께 고려했습니다.',lead:'구간 평균 LST를 종속변수로 두고 거리 구간, 로그 공원면적, 촬영일 고정효과를 포함했습니다. 공원 ID 단위 군집 강건 표준오차를 사용했습니다.',type:'table',headers:['모형 요소','정의'],rows:[['종속변수','공원–날짜–구간 평균 LST (°C)'],['거리 기준','300–500m 고리'],['설명변수','구간 + ln(공원면적 ha)'],['시간 통제','촬영일 고정효과'],['불확실성','공원 ID 군집 강건 표준오차']]},
{sec:'INTERPRETATION',title:'LST는 기온이나 체감온도와 다릅니다.',lead:'위성은 통과 시점의 표면 열을 관측합니다. 보행자 높이의 기온, 평균복사온도, 체감온도, 주거지 냉방 효과를 직접 측정한 결과가 아닙니다.',type:'quote',quote:'이번 연구의 결과변수는<br><b>위성 통과 시점의 지표면온도(LST)</b>입니다.'},
{sec:'MAIN RESULT',title:'공원 내부는 기준 외곽보다 평균 1.557°C 낮았습니다.',lead:'83개 공원·6일·동일 육지 픽셀 분석에서 내부 − 300–500m 계수는 −1.557°C였습니다. 95% 신뢰구간은 −2.300~−0.813°C, p=0.0000404입니다.',type:'mainresult',metrics:[['−1.557°C','내부 − 300–500m'],['−2.300 ~ −0.813','95% 신뢰구간'],['0.0000404','p값']]},
{sec:'SENSITIVITY',title:'날짜 추가보다 공간 표본 선택에 민감했습니다.',lead:'A→B에서는 표본이 144개에서 83개로 바뀌며 계수가 달라졌습니다. B→C는 동일한 83개 공원과 픽셀을 유지하고 날짜만 3일에서 6일로 늘린 비교입니다.',type:'table',headers:['분석 표본','공원·날짜','내부 − 기준'],rows:[['A. 기존 3일','144개 · 3일','−1.242°C'],['B. 동일 83개·기존 3일','83개 · 3일','−1.555°C'],['C. 동일 83개·전체 6일','83개 · 6일','−1.557°C']]},
{sec:'OUTSIDE RINGS',title:'공원 밖의 냉각 거리 경사는 뚜렷하지 않았습니다.',lead:'6일 모형에서 0–100m와 300–500m의 차이는 −0.357°C(95% CI −0.827~+0.113, p=0.137)로 유의하지 않았습니다. 100–300m는 기준보다 +0.344°C였지만, 이는 단조로운 냉각 경사를 뜻하지 않습니다.',type:'cards',cards:[['0–100m 대비','−0.357°C · p=0.137'],['100–300m 대비','+0.344°C · p=0.023'],['공원별 일관성','83개 중 55개에서 6일 평균 내부가 기준 고리보다 낮음']]},
{sec:'PARK SIZE & NDVI',title:'면적 효과와 식생 보정은 탐색 결과로 남깁니다.',lead:'6일 표본에서 면적 두 배당 내부–외곽 차이 변화는 −0.259°C(p=0.170)로 유의하지 않았습니다. NDVI 모형은 39개 공원으로 줄어들며 내부 계수의 부호가 반전돼 별도 질문으로 해석해야 합니다.',type:'table',headers:['탐색 분석','결과','해석'],rows:[['면적 두 배당 변화','−0.259°C · p=0.170','면적 효과 확인 안 됨'],['NDVI 미포함 (39개)','−1.167°C · p=0.038','동일 39개 비교 기준'],['NDVI 포함 (39개)','+1.848°C · p=0.0000400','표본·조건부 질문이 달라짐']]},
{sec:'LIMITATIONS',title:'평균 차이는 인과 효과나 부산 전체의 대표값이 아닙니다.',lead:'관측 날짜는 6일이며 7월 하루·8월 다섯 날에 치우쳤습니다. 작은 공원과 일부 지역의 탈락, OSM 경계, 열적외선 원해상도 약 100m, 주변 토지피복과 지형 등 미통제 요인이 남습니다.',type:'cards',cards:[['시간 대표성','6일만으로 여름 전체·계절 효과를 추정할 수 없음'],['표본 선택','83개 공원은 부산 공원 대표 표본이 아님'],['인과 해석','관찰 연구이며 공원 조성의 인과 효과를 식별하지 않음']]},
{sec:'CONCLUSION',title:'관측된 공원 내부 표면은 평균적으로 더 낮았습니다.',lead:'동일 지점 민감도 분석에서도 내부–외곽 평균 차이는 안정적이었습니다. 그러나 공원 밖의 일관된 냉각 범위, 공원 규모에 따른 차이, 기온 저감 효과까지 입증한 것은 아닙니다.',type:'take',cards:[['확인한 것','관측된 날·잔존 표본에서 내부 LST가 기준 외곽보다 평균적으로 낮음'],['확인하지 못한 것','공원 밖의 단조로운 냉각 경사와 면적에 따른 유의한 차이'],['다음 단계','소형·탈락 지역 보강, 다양한 계절·기상, 현장 기온·복사열 관측']]},
{sec:'SOURCES',title:'자료와 분석 근거',lead:'발표의 수치와 해석은 2026년 11월 20일자 최종 민감도 분석 및 연구설계 검토 문서를 기준으로 정리했습니다.',type:'refs',refs:['부산공원_6일_최종민감도분석_2026-11-20.md','부산공원_정식연구설계_타당성_최종검토_2026-11-20.md','Landsat Collection 2 Level-2: Planetary Computer STAC','ESA WorldCover 2021 v200','OpenStreetMap 공원 경계(기존 분석 자료)']}

function visual(s){if(s.type==='hero')return '<div class="hero-art"><i class="sun"></i><i class="hill"></i><i class="tree"></i><i class="path"></i></div>';if(s.type==='toc')return '<div class="toc">'+['01–06 연구 배경과 질문','07–12 범위·자료·공간 구간','13–18 전처리·표본·모형','19–22 실제 분석 결과','23–24 한계·결론·출처'].map((x,i)=>'<div><b>PART 0'+(i+1)+'</b>'+x+'</div>').join('')+'</div>';if(s.type==='quote')return '<div class="quote">'+s.quote+'</div>';if(s.type==='rings')return '<div><div class="ringviz"><i class="ring r4"></i><i class="ring r3"></i><i class="ring r2"></i><i class="ring r1"></i></div><div class="grid4 small"><div>내부</div><div>0–100m</div><div>100–300m</div><div>300–500m</div></div></div>';if(s.type==='metrics'||s.type==='mainresult')return '<div class="metrics">'+s.metrics.map(x=>'<div class="metric"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div>';if(s.type==='cards'||s.type==='take')return '<div class="'+(s.type==='take'?'grid3':'grid3')+'">'+s.cards.map(x=>'<article class="panel"><h3>'+x[0]+'</h3><p class="small">'+x[1]+'</p></article>').join('')+'</div>';if(s.type==='steps')return '<div class="steps">'+s.steps.map(x=>'<article><b>'+x[0]+'</b><h3>'+x[1]+'</h3><p class="small">'+x[2]+'</p></article>').join('')+'</div>';if(s.type==='table')return '<div class="tablewrap"><table><thead><tr>'+s.headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+s.rows.map(r=>'<tr>'+r.map((x,i)=>'<td class="'+(i===r.length-1?'num':'')+'">'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';if(s.type==='refs')return '<div class="panel"><ol>'+s.refs.map(x=>'<li style="margin:8px 0">'+x+'</li>').join('')+'</ol><p class="small">분석 기준일: 2026-11-20 · 단위: 지표면온도 °C</p></div>';return ''}
const root=document.querySelector('#root');root.innerHTML=slides.map((s,i)=>'<section class="slide '+(i===0?'active ':'')+(s.type==='hero'?'hero two':'')+(s.type==='take'?' dark':'')+'" data-n="'+(i+1)+'"><div><p class="eyebrow">'+s.sec+'</p><h1>'+s.title+'</h1><p class="lead">'+s.lead+'</p></div><div>'+visual(s)+'</div><span class="page">'+String(i+1).padStart(2,'0')+' / '+slides.length+'</span><div class="nav"><button data-prev aria-label="이전">←</button><button data-next aria-label="다음">→</button></div></section>').join('');
let i=0,els=[...document.querySelectorAll('.slide')];function show(n){i=(n+slides.length)%slides.length;els.forEach((e,j)=>e.classList.toggle('active',j===i));location.hash='#'+(i+1);document.querySelector('#sect').textContent=String(i+1).padStart(2,'0')+' · '+slides[i].sec}document.addEventListener('click',e=>{if(e.target.matches('[data-next]'))show(i+1);if(e.target.matches('[data-prev]'))show(i-1)});document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();show(i+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(i-1)}});addEventListener('hashchange',()=>{let n=+location.hash.slice(1);if(n&&n-1!==i)show(n-1)});show(Math.max(0,(+location.hash.slice(1)||1)-1));
</script></body></html>
