</style></head><body><main class="deck"><header class="top"><div class="brand">BUSAN / PARK HEAT</div><div class="sect" id="sect"></div></header><div id="root"></div></main><script>
const D=[
['INTRO','공원 옆에 살면,<br>정말 더 시원할까?','부산 도시공원과 여름철 지표면온도의 관계<br>조경학과 데이터분석 중간고사 대체 과제','hero'],
['CONTENTS','질문에서 분석 계획까지','문제 · 데이터 · 분석 · 시사점','toc'],
['ONE QUESTION','공원과 가까울수록<br>여름의 땅은 덜 뜨거울까?','공원 내부부터 주변 500m까지, 같은 날의 격자별 지표면온도를 비교합니다.','quote'],
['WHY HEAT','도시는 열을 저장합니다.','인공포장이 많은 도시역은 낮은 NDVI와 높은 표면온도가 함께 관찰된다는 대구 선행연구가 있습니다.','bars|S3'],
['LANDSCAPE','열을 낮추는 세 가지 표면','그늘 · 증발산 · 투수 표면은 조경가가 다루는 열환경의 언어입니다.','cards'],
['BUSAN','부산은 하나의 온도가 아닙니다.','해안·산지·고밀 시가지가 공존하므로 공원의 냉각 효과도 장소별로 읽어야 합니다.','map|S1'],
['VULNERABILITY','뜨거운 곳은 무엇이 다를까?','불투수면, 식생 부족, 건물과 도로의 밀도는 함께 살펴야 하는 공간 변수입니다.','cards'],
['PRECEDENT 01','대구·서울: 녹지와 열의 관계','대구 사례는 Landsat으로 NDVI·표면온도·토지피복을 함께 분석했습니다.','nums:1429|5|TM|S3'],
['PRECEDENT 02','구미·신도시: 변화의 효과','식재·개발 전후의 토지피복 변화는 표면 도시열섬 변화와 함께 관찰됩니다.','nums:7.24 / 4.93 km²|+0.14–0.16|−0.8–1.2°C|S4'],
['GAP','부산 공원 주변의 거리별 비교','같은 여름날, 같은 격자 크기, 같은 거리 기준으로 공원 냉각 범위를 살핍니다.','quote'],
['HYPOTHESES','세 가지 가설','H1 가까울수록 낮다 · H2 식생이 많을수록 낮다 · H3 큰 공원일수록 범위가 넓다','cards'],
['TERMS','처음 보는 네 단어','LST는 땅 표면의 온도 · NDVI는 식생 활력 · r은 상관계수 · 회귀는 여러 조건을 함께 보는 분석입니다.','terms'],
['SCOPE','부산 · 여름 · 격자','대상은 부산 도시공원, 기간은 여름철 구름 없는 관측일, 단위는 동일 크기의 분석 격자입니다.','rings'],
['DATA 01','도시공원 데이터','공원 이름·위치·면적·경계는 ‘공원 안’과 ‘공원 밖’을 가르는 기준입니다.','cards|S2'],
['DATA 02','위성은 표면을, 기상청은 공기를 봅니다.','Landsat LST는 표면의 열을, 기상 관측값은 날짜 조건을 설명하는 보조 정보로 씁니다.','cards|S3,S4,S5'],
['COLLECTION','수집 경로를 기록합니다.','공공데이터 API → 공식 포털 → Firecrawl 출처 정리 → Kaggle 보조 데이터 탐색','flow'],
['VARIABLES','무엇을 설명하고, 무엇을 통제할까?','결과: LST · 핵심 원인: 거리·NDVI·면적 · 통제: 불투수면·고도·수면·관측일','cards'],
['ANALYSIS 01–02','먼저 깨끗하게, 그다음 넓게 봅니다.','좌표계·날짜·구름·결측치를 정리하고 지도·분포·이상치를 먼저 확인합니다.','steps'],
['ANALYSIS 03–04','거리를 비교하고, 관계를 분리합니다.','0–100m · 100–300m · 300–500m 버퍼에서 평균·중앙값·표본 수를 비교한 뒤 상관·회귀를 봅니다.','steps'],
['PREVIEW','거리별 평균 온도','실제 데이터가 들어오면 이런 형태로 비교합니다.','example'],
['LIMITS','데이터는 정직하게 읽어야 합니다.','상관은 인과가 아니며, 위성 해상도와 관측 날짜·시간·지형의 영향을 함께 고려합니다.','limits'],
['IMPLICATIONS','조경의 결정을 데이터로 돕습니다.','수관·토양·포장·공원 경계를 열환경 설계와 관리의 판단 근거로 바꿉니다.','take'],
['TIMELINE','수집에서 발표까지','W1 출처 확인 · W2 수집 · W3 전처리·탐색 · W4 분석·시각화 · W5 발표','timeline'],
['REFERENCES','출처와 분석 상태','실제 부산의 거리별 LST 결과는 데이터 수집·검증 뒤에만 제시합니다.','refs']];
function visual(k){let a=k.split('|'),type=a[0],src=a[1]?`<p class="source">[${a[1].replaceAll(',',' · ')}] _inbox / 공공자료</p>`:'';if(type==='hero')return `<div class="hero-art"><i class="sun"></i><i class="hill"></i><i class="tree"></i><i class="path"></i></div>`;if(type==='toc')return `<div class="toc">${['01–05 문제와 조경','06–10 부산과 선행연구','11–15 질문·용어·데이터','16–20 수집·변수·분석','21–23 한계·의미·일정','24 참고문헌'].map(x=>`<div>${x}</div>`).join('')}</div>`;if(type==='quote')return `<div class="quote">“공원이 있나?”가 아니라<br><b>“얼마나 가깝고,<br>어떤 공원인가?”</b></div>`;if(type==='bars'||type==='example')return `<div style="position:relative">${type==='example'?'<span class="example">예시 도식, 실제 수치 아님</span>':''}<div class="barset">${[36,49,68,82].map((x,i)=>`<i style="height:${x}%"><label>${['공원 안','0–100m','100–300m','300–500m'][i]}</label></i>`).join('')}</div></div>`;if(type==='map')return `<div class="map">${['p1','p2','p3','p4'].map(x=>`<i class="pin ${x}"></i>`).join('')}</div>`;if(type.startsWith('nums:'))return `<div class="numgrid">${type.slice(5).split('|').map((x,i)=>`<div><b data-count="${x.replace(/[^0-9.]/g,'')}">${x}</b>${['표본·방법','식생 변화','표면온도 변화'][i]}</div>`).join('')}</div>`;if(type==='terms')return `<div class="terms">${['LST|땅 표면의 온도','NDVI|식생의 녹색 활력','r|함께 움직이는 정도','회귀|여러 조건의 관계'].map(x=>{let[z,y]=x.split('|');return `<article><h3>${z}</h3><p class="small">${y}</p></article>`}).join('')}</div>`;if(type==='rings')return `<div class="rings"><i class="ring r4"></i><i class="ring r3"></i><i class="ring r2"></i><i class="ring r1"></i></div>`;if(type==='flow')return `<div class="flow"><div>공공데이터 API</div><i>→</i><div>공식 포털</div><i>→</i><div>Firecrawl</div><i>→</i><div>Kaggle</div></div>`;if(type==='steps')return `<div class="steps">${['01 전처리','02 탐색','03 거리별 비교','04 상관·회귀'].map(x=>`<article><b>${x.slice(0,2)}</b><h3>${x.slice(3)}</h3><p class="small">기록 가능한 과정으로 남깁니다.</p></article>`).join('')}</div>`;if(type==='limits')return `<div class="limits">${['상관 ≠ 인과','해상도','날짜'].map(x=>`<article><h3>${x}</h3><p class="small">한 가지 값만으로 단정하지 않습니다.</p></article>`).join('')}</div>`;if(type==='take')return `<div class="takegrid"><div><b>설계</b><br>수관·토양·포장</div><div><b>관리</b><br>열 취약 경계</div><div><b>정책</b><br>투자 우선순위</div></div>`;if(type==='timeline')return `<div class="timeline">${['W1 출처','W2 수집','W3 전처리','W4 분석','W5 발표'].map(x=>`<div>${x}</div>`).join('')}</div>`;if(type==='refs')return `<ol class="references"><li>[S1] 여운상 외 (2021), 부산 그린인프라 공간분석.</li><li>[S2] 부산광역시 (2025), 도시공원·유원지·녹지 현황.</li><li>[S3] 박경훈·정성관 (1999), 대구 도시열섬·녹지 분석.</li><li>[S4] 김경훈 외 (2022), 구미 나무심기와 LST 변화.</li><li>[S5] 이경일 (2023), 신도시 표면 열섬 변화.</li></ol><div class="status"><b>분석 상태</b><br>선행연구와 공공자료 기반의 분석 계획입니다.</div>`;return `<div class="cards">${['그늘','증발산','투수 표면'].map(x=>`<article><h3>${x}</h3><p class="small">공간 변수를 함께 기록합니다.</p></article>`).join('')}</div>`+src}
