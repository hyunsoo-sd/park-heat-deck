<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>공원 옆에 살면 정말 더 시원할까?</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<style>
:root{--ink:#102a43;--blue:#2474b5;--teal:#2f855a;--coral:#e76f51;--paper:#f7fafc;--mute:#456073;--line:#dbe5ec;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#dce5eb;color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
h1,h2,h3,p{margin-top:0}
.deck{width:min(1440px,100vw);height:100svh;margin:auto;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.toolbar{flex:none;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 5.5vw;background:rgba(255,255,255,.9);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:-.02em}
.brand i{width:11px;height:11px;border-radius:50%;background:var(--coral)}
.sect{font:12px "DM Mono",monospace;color:#647989}
.theme{display:flex;padding:3px;gap:3px;background:#edf2f5;border-radius:7px}
.theme button{border:0;background:transparent;border-radius:4px;padding:8px 12px;color:#526575;font-size:12px}
.theme button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #aab8c333}
.slides{flex:1;position:relative;min-height:0}
.slide{position:absolute;inset:0;display:none;grid-template-columns:1fr 1fr;gap:6vw;align-content:center;align-items:center;padding:clamp(28px,5vw,80px) 9vw 76px;overflow:auto}
.slide.on{display:grid}
.eyebrow{margin:0 0 16px;font:12px "DM Mono",monospace;letter-spacing:.08em;color:var(--blue)}
h1{max-width:920px;margin-bottom:24px;font-size:clamp(40px,5.6vw,80px);line-height:1.14;letter-spacing:-.065em;font-weight:700}
h2{font-size:clamp(28px,3.9vw,54px);line-height:1.2;letter-spacing:-.06em;font-weight:700;margin-bottom:18px}
.lead{max-width:560px;color:var(--mute);font-size:clamp(15px,1.4vw,20px);line-height:1.7;word-break:keep-all;margin-bottom:0}
.ac{color:var(--teal)}
.note{position:absolute;left:9vw;right:9vw;bottom:24px;margin:0;color:#758795;font-size:11px;padding-right:110px}
.pg{position:absolute;left:9vw;bottom:44px;font:11px "DM Mono",monospace;color:#7c909c}
.nav{position:absolute;right:9vw;bottom:20px;display:flex;gap:8px}
.nav button{width:38px;height:34px;border:1px solid #bdd0dc;border-radius:4px;background:#fff;color:var(--ink)}
.nav button:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.cards:first-child{margin-top:0}
.cards article{padding:16px 18px;border-radius:4px;background:var(--card);border-top:3px solid var(--blue)}
.cards article:nth-child(even){border-top-color:var(--teal)}
.cards b{display:block;font-size:16px;margin-bottom:6px;letter-spacing:-.03em}
.cards p{margin:0;color:var(--mute);font-size:13px;line-height:1.6;word-break:keep-all}
.quote{font-size:clamp(26px,3.4vw,46px);line-height:1.35;letter-spacing:-.06em;font-weight:700;padding:10px 0 10px 24px;border-left:4px solid var(--coral)}
.zone{display:grid;gap:10px;margin-bottom:22px}
.zt{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600}
.zt span{font:12px "DM Mono",monospace;color:#647989;font-weight:400}
.thermo{height:62px;border-radius:5px;overflow:hidden;background:#dce8ed}
.thermo div{height:100%;width:0;background:var(--blue)}
.thermo.warm div{background:var(--coral)}
.ex{margin:6px 0 0;padding:8px 12px;display:inline-block;background:#fff;border-radius:4px;font:12px "DM Mono",monospace;color:var(--coral)}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nums div{padding:18px;background:#fff;border-radius:4px;font-size:13px;color:var(--mute);line-height:1.5}
.nums b{display:block;font:500 clamp(26px,3.2vw,44px) "DM Mono",monospace;letter-spacing:-.06em;color:var(--blue);margin-bottom:6px}
.nums small{font:13px "Noto Sans KR";margin-left:4px}
.map{height:230px;background:#e3eef3;border-radius:5px;position:relative;overflow:hidden}
.map:before{content:"";position:absolute;inset:-10% -10% 40% 35%;background:#58a96d55;border-radius:50% 40% 60% 30%}
.map:after{content:"";position:absolute;left:-5%;right:-5%;bottom:-30%;height:60%;background:#bcd9e8;border-radius:50%}
.pin{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 6px #e76f5133;z-index:1}
.p1{left:25%;top:48%}.p2{left:50%;top:30%}.p3{left:70%;top:55%}.p4{left:38%;top:22%}
.map span{position:absolute;left:12px;top:10px;z-index:2;font:11px "DM Mono",monospace;color:#587382}
.scope{display:flex;flex-wrap:wrap;align-items:center;gap:22px}
.rings{position:relative;flex:none;width:min(260px,70vw);aspect-ratio:1;margin:16px 0}
.box{flex:1 1 150px;display:grid;gap:14px;padding:16px 18px;background:#fff;border-radius:4px;border-left:3px solid var(--blue)}
.box p{margin:0;font-size:14px;font-weight:600;line-height:1.45;word-break:keep-all}
.box span{display:block;margin-bottom:2px;font:400 11px "DM Mono",monospace;color:#647989}
.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #7ea0ae;border-radius:50%}
.r1{width:28%;height:28%;background:#4c9b61cc;border:0}.r2{width:54%;height:54%}.r3{width:78%;height:78%}.r4{width:100%;height:100%}
.rings em{position:absolute;z-index:2;left:50%;transform:translate(-50%,-50%);padding:1px 7px;white-space:nowrap;background:var(--paper);font:normal 11px "DM Mono",monospace;color:#587382}
.flow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.flow div{flex:1;min-width:110px;padding:16px;background:#fff;border-radius:4px;font-size:14px;font-weight:600}
.flow i{color:var(--blue);font-style:normal}
.refs{margin:0;padding-left:20px;color:var(--mute);font-size:13px;line-height:1.85}
.hero{background:linear-gradient(135deg,var(--paper) 55%,#e6f1ec 55%)}
.hg{position:relative;min-height:340px;display:grid;place-items:center}
.sun{position:absolute;width:clamp(120px,16vw,220px);aspect-ratio:1;border-radius:50%;background:var(--coral);top:4%;right:10%;opacity:.92}
.park{width:min(300px,80%);aspect-ratio:1.35;position:relative;z-index:1;transform:skewY(-4deg);background:#58a96d;border-radius:48% 52% 43% 57%/54% 41% 59% 46%}
.park:before,.park:after{content:"";position:absolute;border-radius:50%;background:#8ed18b}
.park:before{width:38%;height:28%;top:20%;left:19%}.park:after{width:23%;height:19%;right:19%;bottom:22%}
.road{position:absolute;z-index:2;width:95%;height:70px;border-top:14px solid #dae4e7;border-bottom:14px solid #dae4e7;transform:rotate(-9deg)}
.house{position:absolute;z-index:3;right:2%;bottom:8%;width:84px;height:66px;background:#fff;border:8px solid #1d4055;border-radius:5px}
.house:before{content:"";position:absolute;left:-16px;top:-48px;border-left:50px solid transparent;border-right:50px solid transparent;border-bottom:44px solid #1d4055}
.tag{position:absolute;z-index:4;right:3%;top:15%;padding:9px 11px;border-radius:5px;background:#fff;color:#27495e;font-size:13px;box-shadow:0 8px 20px #17314b18}
.tag strong{display:block;color:var(--coral);font-size:18px}
.hint{display:flex;align-items:center;gap:10px;margin-top:26px;color:#637b8b;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.8);opacity:.25}}
/* Tesla theme */
.deck.tesla{--ink:#171a20;--blue:#3e6ae1;--teal:#171a20;--coral:#3e6ae1;--paper:#fff;--mute:#393c41;--line:#eee;background:#fff}
.tesla .toolbar{background:#fff;border:0}
.tesla .brand i{border-radius:0}
.tesla .theme{background:#f4f4f4;border-radius:4px}
.tesla .theme button,.tesla .theme button.on,.tesla .nav button{border-radius:4px;box-shadow:none}
.tesla h1,.tesla h2{font-weight:500}
.tesla .cards article,.tesla .nums div,.tesla .flow div{background:#f4f4f4;border-radius:0}
.tesla .hero{background:#f4f4f4}
.tesla .sun{border-radius:0;width:36%;aspect-ratio:1.7;top:10%;right:-6%;opacity:1}
.tesla .park{background:#171a20;border-radius:0;transform:none;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}
.tesla .park:before,.tesla .park:after{background:#fff;border-radius:0;opacity:.27}
.tesla .road{border-color:#fff}
.tesla .house{border-radius:0;border-color:#171a20}.tesla .house:before{border-bottom-color:#171a20}
.tesla .tag{box-shadow:none;border-radius:0}
.tesla .thermo{border-radius:0;background:#e4e4e4}
.tesla .ex{background:#f4f4f4;border-radius:0}
.tesla .box{background:#f4f4f4;border-radius:0}
.tesla .map{border-radius:0;background:#f4f4f4}.tesla .map:before{background:#171a2033}.tesla .map:after{background:#d9dde8}
.tesla .note{color:#5c5e62}
@media(max-width:760px){
.toolbar{padding:0 20px}.brand{font-size:11px}.sect{display:none}.theme button{padding:7px 8px}
.slide{grid-template-columns:1fr;gap:20px;align-content:start;padding:32px 24px 90px}
.hero .hg{order:-1;min-height:240px}
.cards{grid-template-columns:1fr 1fr}.nums{grid-template-columns:1fr 1fr}
.pg{left:24px}.nav{right:24px}.note{left:24px;right:24px;bottom:62px;padding-right:0}
}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<main class="deck" id="deck">
  <header class="toolbar">
    <div class="brand"><i></i>DATA / BUSAN PARK HEAT</div>
    <div class="sect" id="sect"></div>
    <div class="theme" aria-label="디자인 시안 선택"><button class="on" data-theme="ppt">01 · PPT 양식</button><button data-theme="tesla">02 · TESLA</button></div>
  </header>
  <div class="slides" id="root"></div>
</main>
<script>
const D=[

{e:'CONTENTS',t:'질문에서 분석 계획까지',l:'문제를 먼저 보고, 데이터를 모으고, 분석 방법과 한계를 정리합니다.',i:[['03–05','질문과 조경의 관점'],['06–10','부산과 선행연구'],['11–15','가설·용어·데이터'],['16–20','수집·변수·분석'],['21–23','한계·의미·일정'],['24','참고문헌']]},
{e:'ONE QUESTION',t:'공원과 가까울수록<br>여름의 땅은 덜 뜨거울까?',l:'공원 내부부터 주변 500 m까지, 같은 날의 격자별 지표면온도를 비교합니다.',v:'quote',i:['“공원이 있나?”가 아니라<br>“얼마나 가깝고, 어떤 공원인가?”']},

{e:'LANDSCAPE LENS',t:'조경가가 다루는<br>열을 낮추는 세 표면',l:'공원의 시원함은 하나의 요인이 아니라 설계 가능한 표면의 조합입니다.',i:[['그늘','수관이 햇빛을 막아 표면이 덜 달아오릅니다.'],['증발산','식물과 흙의 수분이 증발하며 열을 가져갑니다.'],['투수 표면','빗물이 스며 수분을 저장해 표면 열을 완화합니다.']]},

{e:'RESEARCH QUESTION',t:'이 분석이 채우려는<br>질문',l:'선행연구는 녹지의 양과 형태를 다뤘습니다. 이 분석은 부산 공원 주변을 같은 날짜·같은 거리 구간으로 나눠 봅니다.',v:'quote',i:['같은 여름날,<br>같은 격자,<br>같은 거리 기준']},

{e:'TERMS',t:'처음 보는 네 단어',l:'분석에 나올 용어를 한 줄로 먼저 정리합니다.',i:[['LST','위성이 본 땅 표면의 온도. 사람 키 높이의 기온과는 다릅니다.'],['NDVI','식물이 얼마나 푸른지 나타내는 지수. 높을수록 식생이 풍부합니다.'],['상관계수','두 값이 함께 움직이는 정도. −1에서 1 사이입니다.'],['회귀분석','다른 조건을 고정하고 한 요인의 영향을 추정합니다.']]},

const cards=a=>`<div class="cards">${a.map(x=>`<article><b>${x[0]}</b><p>${x[1]}</p></article>`).join('')}</div>`;
function vis(s){const t=s.v,a=s.i||[];
 if(t==='hero')return `<div class="hg"><i class="sun"></i><i class="road"></i><i class="park"></i><i class="house"></i><div class="tag"><strong>공원 옆</strong>어디까지일까?</div></div>`;
 if(t==='quote')return `<div class="quote">${a[0]}</div>`;
 if(t==='thermo')return `<div>${a.map(z=>`<div class="zone"><div class="zt">${z[0]}<span>${z[1]}</span></div><div class="thermo${z[3]?' warm':''}"><div data-w="${z[2]}"></div></div></div>`).join('')}<p class="ex">${s.ex}</p></div>`;
 if(t==='map')return `<div><div class="map"><span>개념 도식 · 실제 지도 아님</span>${[1,2,3,4].map(n=>`<i class="pin p${n}"></i>`).join('')}</div>${cards(a)}</div>`;
 if(t==='nums')return `<div class="nums">${a.map(x=>`<div><b${/^[\d.]+$/.test(x[0])?` data-to="${x[0]}"`:''}>${x[0]}<small>${x[1]}</small></b>${x[2]}</div>`).join('')}</div>`;
 if(t==='rings')return `<div class="scope"><div class="rings"><i class="ring r4"></i><i class="ring r3"></i><i class="ring r2"></i><i class="ring r1"></i><em style="top:50%;background:none;color:#fff">공원</em><em style="top:23%">0–100 m</em><em style="top:11%">100–300 m</em><em style="top:0">300–500 m</em></div><div class="box">${a.map(x=>`<p><span>${x[0]}</span>${x[1]}</p>`).join('')}</div></div>`;
 if(t==='flow')return `<div class="flow">${a.map((x,k)=>(k?'<i>→</i>':'')+`<div>${x}</div>`).join('')}</div>`;
 if(t==='refs')return `<ol class="refs">${a.map(x=>`<li>${x}</li>`).join('')}</ol>`;
 return cards(a)}
const root=document.getElementById('root'),deck=document.getElementById('deck'),N=D.length;
root.innerHTML=D.map((s,k)=>`<section class="slide${k?'':' hero on'}"><div>${k?`<p class="eyebrow">${s.e}</p><h2>${s.t}</h2>`:`<p class="eyebrow">${s.e}</p><h1>${s.t}</h1>`}<p class="lead">${s.l}</p>${k?'':'<p class="hint"><span class="dot"></span>방향키, 스와이프 또는 아래 버튼으로 넘기기</p>'}</div>${vis(s)}${s.n?`<p class="note">${s.n}</p>`:''}<span class="pg">${String(k+1).padStart(2,'0')} / ${N}</span><div class="nav"><button data-prev aria-label="이전">←</button><button data-next aria-label="다음">→</button></div></section>`).join('');
const S=[...document.querySelectorAll('.slide')];let i=0;
function go(n){i=(n+N)%N;S.forEach((s,j)=>s.classList.toggle('on',j===i));
 if(location.hash!=='#'+(i+1))history.replaceState(null,'','#'+(i+1));
 document.getElementById('sect').textContent=String(i+1).padStart(2,'0')+' · '+D[i].e;
 const s=S[i],e=[...s.querySelectorAll('.eyebrow,h1,h2,.lead,.cards article,.nums div,.zone,.quote,.flow div,.refs li,.hg')];
 if(window.anime){
  anime({targets:e,opacity:[0,1],translateY:[14,0],delay:anime.stagger(50),duration:480,easing:'easeOutCubic'});
  s.querySelectorAll('.thermo div').forEach(b=>anime({targets:b,width:['0%',b.dataset.w+'%'],delay:300,duration:1000,easing:'easeOutCubic'}));
  s.querySelectorAll('[data-to]').forEach(b=>{const to=+b.dataset.to,d=(b.dataset.to.split('.')[1]||'').length,o={v:0};anime({targets:o,v:to,duration:1100,delay:200,easing:'easeOutCubic',update:()=>{b.firstChild.textContent=o.v.toFixed(d)}})});
 }
 setTimeout(()=>{e.forEach(x=>{x.style.opacity=1;x.style.transform='none'});s.querySelectorAll('.thermo div').forEach(b=>b.style.width=b.dataset.w+'%');s.querySelectorAll('[data-to]').forEach(b=>b.firstChild.textContent=b.dataset.to)},1500)}
document.addEventListener('click',e=>{if(e.target.matches('[data-next]'))go(i+1);if(e.target.matches('[data-prev]'))go(i-1)});
document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(i+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(i-1)}});
let sx=0;root.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX},{passive:true});
root.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(i+(d<0?1:-1))},{passive:true});
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{deck.classList.toggle('tesla',b.dataset.theme==='tesla');document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('on',x===b))});
addEventListener('hashchange',()=>{const n=+location.hash.slice(1);if(n&&n-1!==i)go(n-1)});
addEventListener('load',()=>go(Math.min(N,Math.max(1,+location.hash.slice(1)||1))-1));
</script>
